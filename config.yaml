model:
  name: deepseek-chat
  provider: deepseek

# Delegación — keys verificadas contra el schema real de Hermes v0.20.x.
# NO usar `skills.enabled` (no existe) ni `agent.max_iterations`
# (la real es `agent.max_turns`).
delegation:
  max_spawn_depth: 2              # profundidad del árbol (rango 1-3)
  max_concurrent_children: 4      # los 4 sub-agentes QA en paralelo
  child_timeout_seconds: 1200     # 20 min por auditoría de área
  inherit_mcp_toolsets: false     # intersección estricta de toolsets
  # Sub-agentes en background: el padre es dueño de stdin, así que un
  # child que topa un prompt de aprobación deadlockearía si bloqueara.
  # false = auto-deny (seguro). true = auto-approve (solo batch confiable).
  subagent_auto_approve: false

terminal:
  backend: local
  timeout: 1800

agent:
  max_turns: 40                   # iteraciones de tool-calling
  gateway_timeout: 240
